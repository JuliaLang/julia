name: Nanosoldier daily benchmarks
# Ask Nanosoldier to benchmark the latest master commit, which it compares
# against the previous daily run. Nanosoldier picks the request up from the
# commit comment through its webhook.

on:
  schedule:
    - cron: '0 10 * * *'
  workflow_dispatch:

permissions: {}

jobs:
  request:
    if: github.repository == 'JuliaLang/julia' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write # necessary to comment on a commit
    steps:
      - name: Comment on the master commit
        env:
          GH_TOKEN: ${{ github.token }}
          BODY: |
            Executing the daily benchmark build, Nanosoldier will reply here when finished:

            @nanosoldier `runbenchmarks(isdaily = true, priority = "low")`
        run: gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/comments" -f body="$BODY"
