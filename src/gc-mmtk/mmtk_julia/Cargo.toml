[package]
name = "mmtk-julia"
version = "0.32.0"
authors = ["Eduardo Souza <ledusou@gmail.com>", "Yi Lin <qinsoon@gmail.com>"]
build = "build.rs"
edition = "2018"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
crate-type = ["cdylib"]

[build-dependencies]
cc = "*"
built = { version = "*", features = ["git2"] }
bindgen = "*"

[profile.release]
lto = true
# Line tables only. Costs nothing at runtime and is what makes a sampling profile of the
# binding readable: without it every Rust frame resolves to the nearest exported C symbol.
debug = 1

[dependencies]
libc = "0.2"
lazy_static = "1.1"
dashmap = "6.2.1"
# Be very careful to commit any changes to the following mmtk dependency, as our CI scripts (including mmtk-core CI)
# rely on matching these lines to modify them: e.g. comment out the git dependency and use the local path.
# These changes are safe:
# - change branch
# - change repo name
# But other changes including adding/removing whitespaces in commented lines may break the CI
mmtk = { git = "https://github.com/oscardssmith/mmtk-core.git", rev = "6ace8dd500a3aaf8fdf1540a1fffb32395146081" }
# Uncomment the following to build locally
# mmtk = { path = "../mmtk-core" }
log = {version = "0.4", features = ["max_level_trace", "release_max_level_off"] }
enum-map = ">=2.1"
atomic = "0.4.6"
chrono = "*"
thread-id = "*"
memoffset = "*"

# ykstackmaps = { git = "https://github.com/udesou/ykstackmaps.git", branch = "udesou-master", version = "*" }

[features]
default = ["mmtk/vm_space", "julia_copy_stack", "object_pinning"]

# VM-side support every plan that marks concurrently with the mutator needs, independent of
# which plan it is: the `CONCURRENT_MARKING_ACTIVE` flag, gcstack snapshots so a running
# task's stack is scanned from a stable copy, and treating weak references as strong for the
# duration of the mark. This used to be spelled `concurrentimmix`, which silently excluded
# LXR -- so LXR marked entirely inside its `FinalMark` pause. Keep it enabled by every
# concurrent plan; `concurrentimmix` still selects the ConcurrentImmix *plan*.
concurrent_marking = []

# Plans
nogc = []
immix = []
stickyimmix = ["mmtk/sticky_immix_non_moving_nursery", "mmtk/immix_smaller_block", "mmtk/set_unlog_bits_vm_space"]
concurrentimmix = ["mmtk/immix_smaller_block", "mmtk/set_unlog_bits_vm_space", "concurrent_marking"]
# Uses LXR's own per-field barrier: codegen passes the written field's address
# (MMTK_FIELD_BARRIER), so there is no need for the object-granularity fallback.
#
# Concurrent marking is on. It is the reason to want LXR here at all, so it is not
# something to leave switched off for convenience.
#
# Everything the plan needs except the choice of decrement timing. Code that asks "is this
# an LXR build?" -- plan selection, the barrier's slow path -- must test `lxr_base`, not
# `lxr_lazy` or `lxr`, or the other of the two silently falls through to the default plan
# and trips the allocator-offset assertion in `mmtk_gc_init`.
lxr_base = ["mmtk/immix_smaller_block", "mmtk/set_unlog_bits_vm_space", "concurrent_marking"]
# What `MMTK_PLAN=LXR` builds: decrement processing and the mature sweeps run concurrently
# rather than inside the pause, which is LXR's own configuration.
lxr_lazy = ["lxr_base"]
# `lxr_lazy` with `lxr_no_lazy` added, keeping decrements eager. This was the remaining half
# of the `lxr_stw` bring-up simplification, kept as a fallback: with lazy decrements a
# nursery large object could be freed by `release_rc_nursery_objects` and by a concurrent
# `rc_free` both, corrupting the page resource's freelist. If that resurfaces, build this to
# confirm the decrement timing is the cause. Cargo features are additive, so it has to be a
# sibling of `lxr_lazy` rather than `lxr_lazy` minus something.
lxr = ["lxr_base", "mmtk/lxr_no_lazy"]
# Bring-up aid: mmtk's internal side-metadata and address sanity checks. Slow; not for
# normal builds.
lxr_debug = ["lxr_lazy", "mmtk/extreme_assertions"]
marksweep = []
object_pinning = ["mmtk/object_pinning"]

# This feature disables moving.
# For LXR, moving is a property of the plan rather than of the Immix space alone:
# `lxr_no_evac` turns off both nursery and mature evacuation. This is permanent for Julia
# rather than a bring-up simplification -- moving objects makes C interop too difficult --
# so LXR here is a concurrent, non-moving, reference-counting collector. It is also what
# makes treating LXR's pinning roots as ordinary strong roots sound, which Julia's
# conservative stack scanning relies on.
non_moving = ["mmtk/immix_non_moving", "mmtk/immix_smaller_block", "mmtk/lxr_no_evac"]
julia_copy_stack = []
