\* A hook that waits for its listener in the fallback teardown: expect a NoDeadlineKill violation.
SPECIFICATION Spec
CONSTANTS
    N = 2
    Interactive = {2}
    Work = 2
    Lag = 1
    Grace = 4
    Teardown = 4
    Watch = "pass"
    HookWait = TRUE
INVARIANT TypeOK
INVARIANT NoFalseFire
INVARIANT NoDeadlineKill
PROPERTY Exits
PROPERTY CooperatingExitsOrdinarily
CHECK_DEADLOCK TRUE
